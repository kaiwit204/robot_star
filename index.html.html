<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมสมองกล: นักออกแบบอัลกอริทึม (10 Levels + Sound)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #f0fdfa 100%);
            touch-action: manipulation;
        }
        .grid-cell {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            border: 2px solid #e5e7eb;
            background-color: white;
            border-radius: 8px;
            transition: all 0.2s ease-in-out;
        }
        @media (min-width: 768px) {
            .grid-cell {
                width: 60px;
                height: 60px;
                font-size: 2rem;
            }
        }
        .robot {
            transition: transform 0.3s ease, top 0.3s ease, left 0.3s ease;
            z-index: 20;
            filter: drop-shadow(0 4px 3px rgb(0 0 0 / 0.15));
        }
        .command-btn {
            transition: all 0.1s;
        }
        .command-btn:active {
            transform: scale(0.95);
        }
        .animate-bounce-short {
            animation: bounce-short 0.5s ease-in-out infinite;
        }
        @keyframes bounce-short {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15%); }
        }
        /* Custom scrollbar for program list */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-2 md:p-6">

    <div class="max-w-5xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row border border-gray-100">
        
        <!-- ฝั่งซ้าย: กระดานเกม -->
        <div class="bg-gradient-to-br from-teal-50 to-emerald-50 p-4 md:p-8 flex flex-col items-center justify-center border-b md:border-b-0 md:border-r border-teal-100 w-full md:w-1/2 relative">
            
            <div class="absolute top-4 left-4 bg-white/80 px-3 py-1 rounded-full shadow-sm text-sm font-bold text-teal-700 border border-teal-200">
                ด่านที่ <span id="level-display" class="text-xl">1</span> / 10
            </div>

            <h1 class="text-2xl md:text-3xl font-bold text-teal-800 mt-6 mb-2 text-center">🤖 นักออกแบบอัลกอริทึม</h1>
            <p class="text-teal-600 mb-6 text-sm text-center font-medium">พาหุ่นยนต์ไปหาดาว โดยไม่ชนกำแพง!</p>
            
            <!-- ตารางกริด 6x6 -->
            <div class="relative bg-gray-200 p-2 md:p-3 rounded-2xl shadow-inner border-2 border-gray-300">
                <div id="game-board" class="grid grid-cols-6 gap-1 md:gap-1.5 relative z-10">
                    <!-- JS จะสร้างช่องที่นี่ -->
                </div>
            </div>

            <div class="mt-6 text-center h-12 flex items-center justify-center w-full">
                <p id="message" class="text-lg md:text-xl font-bold px-4 py-2 rounded-xl transition-all duration-300 opacity-0"></p>
            </div>
        </div>

        <!-- ฝั่งขวา: พื้นที่เขียนโปรแกรม -->
        <div class="p-4 md:p-8 w-full md:w-1/2 flex flex-col bg-white">
            <h2 class="text-xl font-bold text-gray-800 mb-4 flex items-center gap-2">
                📝 ชุดคำสั่งของคุณ
            </h2>
            
            <!-- ปุ่มกดคำสั่ง -->
            <div class="grid grid-cols-3 gap-2 md:gap-3 mb-6">
                <button onclick="addCommand('FORWARD')" class="command-btn bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white py-3 rounded-xl shadow-md font-semibold flex flex-col items-center border-b-4 border-blue-700">
                    <span class="text-2xl md:text-3xl mb-1 drop-shadow-md">⬆️</span> เดินหน้า
                </button>
                <button onclick="addCommand('LEFT')" class="command-btn bg-orange-500 hover:bg-orange-600 active:bg-orange-700 text-white py-3 rounded-xl shadow-md font-semibold flex flex-col items-center border-b-4 border-orange-700">
                    <span class="text-2xl md:text-3xl mb-1 drop-shadow-md">↩️</span> หันซ้าย
                </button>
                <button onclick="addCommand('RIGHT')" class="command-btn bg-purple-500 hover:bg-purple-600 active:bg-purple-700 text-white py-3 rounded-xl shadow-md font-semibold flex flex-col items-center border-b-4 border-purple-700">
                    <span class="text-2xl md:text-3xl mb-1 drop-shadow-md">↪️</span> หันขวา
                </button>
            </div>

            <!-- กล่องแสดงคำสั่งที่เลือก -->
            <div class="flex-1 bg-gray-50 border-2 border-dashed border-gray-300 rounded-xl p-4 mb-6 overflow-y-auto min-h-[180px] max-h-[250px] shadow-inner relative">
                <p class="text-xs text-gray-400 mb-3 font-semibold uppercase tracking-wider">ลำดับอัลกอริทึม (คลิกเพื่อลบ)</p>
                <div id="program-list" class="flex flex-wrap gap-2 content-start">
                    <!-- คำสั่งจะปรากฏที่นี่ -->
                </div>
                <div id="empty-state" class="absolute inset-0 flex items-center justify-center text-gray-400 font-medium pointer-events-none">
                    ยังไม่มีคำสั่ง (กดปุ่มด้านบน)
                </div>
            </div>

            <!-- ปุ่มควบคุมการรัน -->
            <div class="flex gap-3 mt-auto">
                <button onclick="clearProgram()" class="flex-1 bg-rose-100 hover:bg-rose-200 text-rose-700 py-4 rounded-xl font-bold transition flex items-center justify-center gap-2 border-2 border-rose-200">
                    🗑️ ลบทั้งหมด
                </button>
                <button id="run-btn" onclick="runProgram()" class="flex-[2] bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 text-white py-4 rounded-xl font-bold text-xl shadow-lg transition flex items-center justify-center gap-2 border-b-4 border-emerald-700">
                    ▶️ รันคำสั่ง
                </button>
            </div>
        </div>

    </div>

    <script>
        // --- Web Audio API สำหรับสร้างเสียง ---
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, type, duration, vol = 0.1) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playSoundClick() { playTone(600, 'sine', 0.1, 0.1); }
        function playSoundMove() { playTone(300, 'square', 0.15, 0.05); }
        function playSoundTurn() { playTone(450, 'triangle', 0.1, 0.05); }
        
        function playSoundError() {
            if (!audioCtx) return;
            playTone(200, 'sawtooth', 0.2, 0.1);
            setTimeout(() => playTone(150, 'sawtooth', 0.4, 0.1), 200);
        }

        function playSoundSuccess() {
            if (!audioCtx) return;
            // ดนตรีสั้นๆ เมื่อผ่านด่าน (Arpeggio)
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            notes.forEach((freq, i) => {
                setTimeout(() => {
                    playTone(freq, 'sine', 0.15, 0.1);
                }, i * 120);
            });
        }

        // --- ตั้งค่าเกมและข้อมูลด่าน ---
        const GRID_SIZE = 6;
        
        // 0=เหนือ, 1=ตะวันออก, 2=ใต้, 3=ตะวันตก
        const DIRECTIONS = [
            { dx: 0, dy: -1 }, // เหนือ
            { dx: 1, dy: 0 },  // ขวา
            { dx: 0, dy: 1 },  // ใต้
            { dx: -1, dy: 0 }  // ซ้าย
        ];

        // สร้าง 10 ด่านไล่ระดับความยาก บนพื้นที่ 6x6
        const levels = [
            // Level 1: ทางตรงง่ายๆ
            { start: {x: 1, y: 5, dir: 0}, goal: {x: 1, y: 1}, obstacles: [] },
            // Level 2: เลี้ยว 1 ครั้ง
            { start: {x: 1, y: 4, dir: 0}, goal: {x: 4, y: 1}, obstacles: [{x:2, y:4}, {x:3, y:4}] },
            // Level 3: เลี้ยวหลบกำแพง
            { start: {x: 0, y: 5, dir: 1}, goal: {x: 5, y: 2}, obstacles: [{x:2, y:5}, {x:2, y:4}, {x:2, y:3}] },
            // Level 4: ซิกแซก
            { start: {x: 0, y: 0, dir: 1}, goal: {x: 5, y: 5}, obstacles: [{x:2, y:0}, {x:2, y:1}, {x:2, y:2}, {x:4, y:5}, {x:4, y:4}, {x:4, y:3}] },
            // Level 5: อ้อมหลังกำแพง
            { start: {x: 2, y: 5, dir: 0}, goal: {x: 2, y: 0}, obstacles: [{x:1, y:3}, {x:2, y:3}, {x:3, y:3}] },
            // Level 6: กล่อง U-shape
            { start: {x: 3, y: 3, dir: 1}, goal: {x: 0, y: 0}, obstacles: [{x:2, y:2}, {x:3, y:2}, {x:4, y:2}, {x:2, y:3}, {x:2, y:4}, {x:3, y:4}, {x:4, y:4}] },
            // Level 7: เขาวงกต 1
            { start: {x: 0, y: 5, dir: 1}, goal: {x: 5, y: 0}, obstacles: [{x:1, y:5}, {x:1, y:4}, {x:1, y:2}, {x:1, y:1}, {x:3, y:4}, {x:3, y:3}, {x:3, y:2}, {x:4, y:0}, {x:4, y:2}] },
            // Level 8: ทางแคบ
            { start: {x: 0, y: 2, dir: 1}, goal: {x: 5, y: 3}, obstacles: [{x:1, y:1}, {x:1, y:3}, {x:2, y:1}, {x:2, y:3}, {x:3, y:1}, {x:3, y:3}, {x:4, y:1}, {x:4, y:3}] },
            // Level 9: วนก้นหอย
            { start: {x: 0, y: 0, dir: 1}, goal: {x: 2, y: 3}, obstacles: [{x:0, y:1}, {x:1, y:1}, {x:2, y:1}, {x:4, y:1}, {x:5, y:1}, {x:5, y:2}, {x:5, y:3}, {x:5, y:4}, {x:5, y:5}, {x:4, y:5}, {x:3, y:5}, {x:2, y:5}, {x:1, y:5}, {x:0, y:5}, {x:0, y:4}, {x:0, y:3}] },
            // Level 10: เขาวงกตสุดท้าทาย
            { start: {x: 0, y: 5, dir: 0}, goal: {x: 5, y: 2}, obstacles: [{x:0, y:4}, {x:2, y:5}, {x:2, y:4}, {x:2, y:3}, {x:2, y:1}, {x:3, y:1}, {x:4, y:1}, {x:4, y:3}, {x:4, y:4}, {x:5, y:4}] }
        ];

        let currentLevelIndex = 0;
        let robot = { x: 0, y: 0, dir: 0, rotationDeg: 0 }; 
        let program = [];
        let isRunning = false;

        const boardEl = document.getElementById('game-board');
        const programListEl = document.getElementById('program-list');
        const emptyStateEl = document.getElementById('empty-state');
        const messageEl = document.getElementById('message');
        const levelDisplayEl = document.getElementById('level-display');
        const runBtn = document.getElementById('run-btn');

        function initGame() {
            loadLevel(currentLevelIndex);
        }

        function loadLevel(index) {
            if (index >= levels.length) {
                showMessage("🎉 ยินดีด้วย! คุณเคลียร์ครบ 10 ด่านแล้ว เก่งมากๆ!", "bg-green-100 text-green-700 border-green-400");
                playSoundSuccess();
                return;
            }
            
            const level = levels[index];
            robot = { x: level.start.x, y: level.start.y, dir: level.start.dir, rotationDeg: level.start.dir * 90 };
            levelDisplayEl.textContent = index + 1;
            program = [];
            isRunning = false;
            
            updateProgramUI();
            drawBoard();
            hideMessage();
        }

        function drawBoard() {
            boardEl.innerHTML = '';
            const level = levels[currentLevelIndex];

            for (let y = 0; y < GRID_SIZE; y++) {
                for (let x = 0; x < GRID_SIZE; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell relative overflow-hidden';
                    
                    // สิ่งกีดขวาง
                    const isObstacle = level.obstacles.some(obs => obs.x === x && obs.y === y);
                    if (isObstacle) {
                        cell.innerHTML = '🧱';
                        cell.classList.add('bg-orange-100', 'border-orange-200');
                    }
                    
                    // เป้าหมาย (ดาว)
                    if (level.goal.x === x && level.goal.y === y) {
                        cell.innerHTML = '<span class="animate-bounce-short text-3xl">🌟</span>';
                        cell.classList.add('bg-yellow-100', 'border-yellow-300', 'shadow-[inset_0_0_15px_rgba(253,224,71,0.5)]');
                    }

                    // หุ่นยนต์
                    if (robot.x === x && robot.y === y) {
                        const robotEl = document.createElement('div');
                        robotEl.className = 'absolute inset-0 flex items-center justify-center robot text-3xl z-20';
                        robotEl.innerHTML = '🤖';
                        robotEl.style.transform = `rotate(${robot.rotationDeg}deg)`;
                        cell.appendChild(robotEl);
                    }

                    boardEl.appendChild(cell);
                }
            }
        }

        function addCommand(cmd) {
            initAudio(); // Initialize Audio on first interaction
            if (isRunning) return;
            program.push(cmd);
            playSoundClick();
            updateProgramUI();
            
            // Auto scroll to bottom of program list
            setTimeout(() => {
                programListEl.parentElement.scrollTop = programListEl.parentElement.scrollHeight;
            }, 50);
        }

        function removeCommand(index) {
            if (isRunning) return;
            program.splice(index, 1);
            playSoundClick();
            updateProgramUI();
        }

        function clearProgram() {
            if (isRunning || program.length === 0) return;
            program = [];
            playSoundClick();
            updateProgramUI();
        }

        function updateProgramUI() {
            programListEl.innerHTML = '';
            
            if (program.length > 0) {
                emptyStateEl.style.display = 'none';
            } else {
                emptyStateEl.style.display = 'flex';
            }
            
            const labels = {
                'FORWARD': { icon: '⬆️', text: 'เดินหน้า', color: 'bg-blue-100 text-blue-700 border-blue-300' },
                'LEFT': { icon: '↩️', text: 'ซ้าย', color: 'bg-orange-100 text-orange-700 border-orange-300' },
                'RIGHT': { icon: '↪️', text: 'ขวา', color: 'bg-purple-100 text-purple-700 border-purple-300' }
            };

            program.forEach((cmd, index) => {
                const badge = document.createElement('div');
                badge.className = `px-3 py-1.5 rounded-lg border-2 text-sm font-bold cursor-pointer hover:scale-105 active:scale-95 transition-transform flex items-center gap-1 shadow-sm ${labels[cmd].color}`;
                badge.innerHTML = `<span class="text-lg">${labels[cmd].icon}</span> ${labels[cmd].text}`;
                badge.onclick = () => removeCommand(index);
                programListEl.appendChild(badge);
            });
        }

        function resetRobotToStart() {
            const level = levels[currentLevelIndex];
            robot = { x: level.start.x, y: level.start.y, dir: level.start.dir, rotationDeg: level.start.dir * 90 };
            drawBoard();
        }

        function showMessage(msg, classes) {
            messageEl.textContent = msg;
            messageEl.className = `text-lg md:text-xl font-bold px-6 py-2 rounded-xl transition-all duration-300 opacity-100 border-2 shadow-md ${classes}`;
        }

        function hideMessage() {
            messageEl.className = "opacity-0";
        }

        const delay = ms => new Promise(res => setTimeout(res, ms));

        async function runProgram() {
            if (isRunning || program.length === 0) return;
            initAudio(); // Ensure audio is ready
            
            isRunning = true;
            runBtn.classList.add('opacity-50', 'cursor-not-allowed', 'grayscale');
            hideMessage();
            resetRobotToStart(); // เริ่มที่จุดเริ่มต้นเสมอ

            const level = levels[currentLevelIndex];
            let success = false;
            let crashed = false;

            // รันแต่ละคำสั่ง
            for (let i = 0; i < program.length; i++) {
                const cmd = program[i];
                
                // Highlight current command
                Array.from(programListEl.children).forEach((el, idx) => {
                    if (idx === i) el.classList.add('ring-4', 'ring-emerald-400', 'scale-110', 'z-10');
                    else el.classList.remove('ring-4', 'ring-emerald-400', 'scale-110', 'z-10');
                });

                await delay(400); // หน่วงเวลาก่อนทำคำสั่ง

                if (cmd === 'FORWARD') {
                    const newX = robot.x + DIRECTIONS[robot.dir].dx;
                    const newY = robot.y + DIRECTIONS[robot.dir].dy;
                    
                    // Rule: เช็คชนขอบกระดาน
                    if (newX < 0 || newX >= GRID_SIZE || newY < 0 || newY >= GRID_SIZE) {
                        crashed = true;
                        playSoundError();
                        showMessage("💥 ว้าก! ตกขอบกระดาน ลองคิดแผนใหม่นะ", "bg-red-100 text-red-700 border-red-400");
                        break;
                    }
                    
                    // Rule: เช็คชนสิ่งกีดขวาง
                    if (level.obstacles.some(obs => obs.x === newX && obs.y === newY)) {
                        crashed = true;
                        playSoundError();
                        showMessage("🧱 ชนกำแพงเต็มๆ! ลองคิดแผนใหม่นะ", "bg-red-100 text-red-700 border-red-400");
                        break;
                    }
                    
                    robot.x = newX;
                    robot.y = newY;
                    playSoundMove();
                } 
                else if (cmd === 'LEFT') {
                    robot.dir = (robot.dir + 3) % 4;
                    robot.rotationDeg -= 90;
                    playSoundTurn();
                } 
                else if (cmd === 'RIGHT') {
                    robot.dir = (robot.dir + 1) % 4;
                    robot.rotationDeg += 90;
                    playSoundTurn();
                }

                drawBoard();
            }

            // นำไฮไลต์ออกทั้งหมด
            Array.from(programListEl.children).forEach(el => el.classList.remove('ring-4', 'ring-emerald-400', 'scale-110', 'z-10'));

            // ตรวจสอบผลลัพธ์สุดท้าย
            if (!crashed) {
                if (robot.x === level.goal.x && robot.y === level.goal.y) {
                    // Success
                    playSoundSuccess();
                    showMessage("🎉 สำเร็จ! อัลกอริทึมยอดเยี่ยมมาก", "bg-green-100 text-green-700 border-green-400");
                    await delay(2000);
                    currentLevelIndex++;
                    loadLevel(currentLevelIndex);
                } else {
                    // Rule: รันจบแต่ไม่ถึงเป้าหมาย
                    playSoundError();
                    showMessage("🤔 รันจบแล้วแต่ยังไปไม่ถึงเป้าหมาย! ลองใหม่นะ", "bg-orange-100 text-orange-700 border-orange-400");
                    crashed = true; // มองว่าเป็นข้อผิดพลาดแบบหนึ่ง
                }
            }

            // Rule: ถ้าทำผิดพลาด (ชน หรือ ไปไม่ถึง) ให้หน่วงเวลาและล้างกระดาน
            if (crashed) {
                await delay(1500);
                program = [];
                updateProgramUI();
                resetRobotToStart();
                hideMessage();
            }

            isRunning = false;
            runBtn.classList.remove('opacity-50', 'cursor-not-allowed', 'grayscale');
        }

        // เริ่มเกม
        initGame();
    </script>
</body>
</html>
